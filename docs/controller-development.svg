<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
<title id="title">How the controller improves across optimization jobs</title><desc id="desc">A fixed proposer uses development traces to change reusable controller instructions or retrieval policy. The candidate controller runs complete application-optimization jobs. Application results, failures, and search cost feed the next proposal. A selected controller is frozen for separate final evaluation against a fixed controller, a memory-only controller, and conventional search. Final tasks and results are withheld from development. Submission limits and reserved or refreshed workloads limit repeated-selection leakage. Promoted versions guide future searches, whose development traces can feed the next cycle.</desc>
<style>
text{font-family:"IBM Plex Sans",Arial,"Liberation Sans",sans-serif;fill:#182838}
.title{font-size:25px;font-weight:700}
.heading{font-size:18px;font-weight:700}
.smallhead{font-size:16px;font-weight:700}
.body{font-size:16px}
.note{font-size:14.5px;fill:#42576a}
.label{font-size:14.5px;fill:#42576a}
.green{fill:#096d61}.red{fill:#9c4337}
.panel{fill:#f7f9fc;stroke:#bcc9d6;stroke-width:1.3}
.card{fill:white;stroke:#b4c2cf;stroke-width:1.3}
.agent{fill:#e2f3ee;stroke:#087f70;stroke-width:1.8}
.final{fill:#fff5ee;stroke:#b36b43;stroke-width:1.6}
.contract{fill:#eaf0f7;stroke:#aebfd0;stroke-width:1.3}
.flow,.feedback,.promote{fill:none;stroke:#33495d;stroke-width:1.8;stroke-linejoin:round}
.feedback{stroke:#65798c;stroke-dasharray:6 4}
.promote{stroke:#087f70;stroke-width:2.2}
.halo{fill:none;stroke:white;stroke-width:6;stroke-linejoin:round}
.xs{font-size:13px;fill:#42576a}
.rung{fill:white;stroke:#087f70;stroke-width:1;stroke-opacity:.55}
.rungstart{fill:white;stroke:#087f70;stroke-width:2.2}
.runglate{fill:white;stroke:#087f70;stroke-width:1;stroke-dasharray:4 3}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#33495d"/></marker>
<marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087f70"/></marker></defs>
<rect width="1120" height="630" fill="white"/>
<text x="24" y="33" class="title" text-anchor="start">How the controller improves across optimization jobs</text>
<text x="24" y="58" class="body" text-anchor="start">Optional offline experiment after application search and compiler evolution demonstrate value.</text>
<rect x="24" y="82" width="710" height="318" rx="7" class="panel"/>
<text x="42" y="110" class="heading" text-anchor="start">Development: feedback is available to the proposer</text>
<rect x="42" y="143" width="180" height="114" rx="7" class="card"/>
<rect x="258" y="143" width="200" height="114" rx="7" class="agent"/>
<rect x="494" y="143" width="222" height="114" rx="7" class="card"/>
<text x="56" y="169" class="smallhead" text-anchor="start">Search traces</text>
<text x="56" y="196" class="body" text-anchor="start">Failures, profiles,</text>
<text x="56" y="220" class="body" text-anchor="start">workloads and cost</text>
<text x="272" y="169" class="smallhead green" text-anchor="start">Fixed proposer</text>
<text x="272" y="196" class="note" text-anchor="start">Agent revises the</text>
<text x="272" y="219" class="note" text-anchor="start">controller procedure</text>
<text x="272" y="242" class="note" text-anchor="start">Version memory too</text>
<text x="508" y="169" class="smallhead" text-anchor="start">Candidate controller</text>
<text x="508" y="196" class="note" text-anchor="start">Run whole search jobs</text>
<text x="508" y="219" class="note" text-anchor="start">Pinned model and tools</text>
<text x="508" y="242" class="note" text-anchor="start">Matched job budget</text>
<polyline points="222,201 255,201" class="flow"/>
<polygon points="255,201 245.0,205.0 245.0,197.0" fill="#33495d"/>
<polyline points="458,201 491,201" class="flow"/>
<polygon points="491,201 481.0,205.0 481.0,197.0" fill="#33495d"/>
<polyline points="605,257 605,302 358,302 358,259" class="feedback"/>
<polygon points="358,259 362.0,269.0 354.0,269.0" fill="#33495d"/>
<text x="481" y="325" class="note" text-anchor="middle">Application results, failures, search cost</text>
<text x="481" y="348" class="note" text-anchor="middle">Revise the next proposal; repeat on development tasks</text>
<text x="42" y="381" class="body" text-anchor="start">Log total compute; measure application speed and search cost separately.</text>
<rect x="770" y="82" width="326" height="318" rx="7" class="final"/>
<text x="788" y="110" class="heading red" text-anchor="start">Separate final evaluation</text>
<text x="788" y="140" class="body" text-anchor="start">Freeze the selected controller.</text>
<text x="788" y="163" class="body" text-anchor="start">Hide final tasks and results</text>
<text x="788" y="186" class="body" text-anchor="start">from the proposer and its traces.</text>
<text x="788" y="224" class="smallhead" text-anchor="start">Compare four methods</text>
<text x="788" y="249" class="note" text-anchor="start">Fixed controller; fixed plus memory</text>
<text x="788" y="272" class="note" text-anchor="start">Evolved; conventional search</text>
<text x="788" y="295" class="note" text-anchor="start">New workload families; repeat runs</text>
<text x="788" y="337" class="note" text-anchor="start">Limit submissions. Reserve or refresh</text>
<text x="788" y="360" class="note" text-anchor="start">tasks; count pass/fail disclosures.</text>
<polyline points="716,201 767,201" class="flow"/>
<polygon points="767,201 757.0,205.0 757.0,197.0" fill="#33495d"/>
<text x="743" y="191" class="label" text-anchor="middle">freeze</text>
<rect x="24" y="436" width="412" height="137" rx="7" class="contract"/>
<text x="42" y="463" class="heading" text-anchor="start">What can change?</text>
<text x="42" y="490" class="body" text-anchor="start">Start: reusable instructions or retrieval policy.</text>
<text x="42" y="515" class="body" text-anchor="start">Later: workflow, controller code, improvement</text>
<text x="42" y="540" class="body" text-anchor="start">procedure. Recursion is a separate experiment.</text>
<rect x="470" y="448" width="264" height="112" rx="7" class="card"/>
<text x="488" y="476" class="heading" text-anchor="start">Future searches</text>
<text x="488" y="504" class="note" text-anchor="start">Use the promoted controller.</text>
<text x="488" y="528" class="note" text-anchor="start">Gather development traces.</text>
<rect x="770" y="436" width="326" height="137" rx="7" class="card"/>
<text x="788" y="463" class="heading" text-anchor="start">Promote or retain</text>
<text x="788" y="490" class="body" text-anchor="start">Report speed and search cost.</text>
<text x="788" y="515" class="body" text-anchor="start">Include total development cost.</text>
<text x="788" y="540" class="body" text-anchor="start">Version the change; retain rollback.</text>
<polyline points="934,400 934,433" class="flow"/>
<polygon points="934,433 930.0,423.0 938.0,423.0" fill="#33495d"/>
<polyline points="770,504 737,504" class="promote"/>
<polygon points="737,504 747.0,500.0 747.0,508.0" fill="#087f70"/>
<polyline points="602,560 602,600 12,600 12,201 39,201" class="feedback"/>
<polygon points="39,201 29.0,205.0 29.0,197.0" fill="#33495d"/>
<text x="311" y="621" class="note" text-anchor="middle">Future development traces exclude final-evaluation tasks and results</text>
</svg>
