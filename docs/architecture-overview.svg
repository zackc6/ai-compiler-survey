<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Where the agent acts in an end-to-end AI compiler</title><desc id="desc">One possible starting design. Humans fix the workload, objective, allowed actions, budget, and acceptance rules for an experiment. In application optimization, an agent, a learned policy, and structured search propose candidates with the same feedback and budget; compiler tools build them; checks and measurement decide; accepted artifacts are stored and deployed with a fallback and no optimizer-model calls by default. Development traces, excluding final-evaluation tasks, feed two development loops. Compiler development generates heuristics, analyses, transformations, or backend pieces. Optional, late-stage controller development starts with instructions or retrieval logic and widens only after measured failures. Each loop iterates on development feedback, freezes a selected version for a hidden final check, and promotes it only if it passes.</desc>
