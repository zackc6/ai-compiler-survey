<text x="734" y="315" class="xs" text-anchor="start">search cost</text>
<rect x="966" y="166" width="180" height="170" rx="7" class="card"/>
<text x="978" y="190" class="smallhead" text-anchor="start">Artifact and</text>
<text x="978" y="210" class="smallhead" text-anchor="start">experiment store</text>
<text x="978" y="242" class="xs" text-anchor="start">accepted artifacts</text>
<text x="978" y="261" class="xs" text-anchor="start">failed candidates</text>
<text x="978" y="280" class="xs" text-anchor="start">controller versions</text>
<text x="978" y="299" class="xs" text-anchor="start">and memory kept</text>
<text x="978" y="318" class="xs" text-anchor="start">separately</text>
<rect x="1190" y="166" width="180" height="170" rx="7" class="card"/>
<text x="1202" y="190" class="smallhead" text-anchor="start">Deploy</text>
