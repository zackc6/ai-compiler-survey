<text x="734" y="220" class="xs" text-anchor="start">static checks, compile</text>
<text x="734" y="239" class="xs" text-anchor="start">tests and numerics</text>
<text x="734" y="258" class="xs" text-anchor="start">scoped equivalence</text>
<text x="734" y="277" class="xs" text-anchor="start">kernel time</text>
