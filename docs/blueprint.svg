<rect x="742" y="292" width="146" height="34" rx="4" class="sub"/>
<text x="815.0" y="313.5" class="t" text-anchor="middle">Scoped equivalence</text>
<text x="815.0" y="354" class="note" text-anchor="middle">record: tested vs proven</text>
<rect x="950" y="130" width="220" height="230" rx="6" class="panel"/>
<text x="964" y="152" class="h" text-anchor="start">Measure on the target</text>
<rect x="962" y="166" width="196" height="34" rx="4" class="sub"/>
<text x="1060.0" y="187.5" class="t" text-anchor="middle">Kernel time</text>
<rect x="962" y="208" width="196" height="34" rx="4" class="sub"/>
