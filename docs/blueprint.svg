<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 918" width="1200" height="918" role="img" aria-label="End-to-end agentic compiler. Humans fix the workload, objective and validation contract. Loop 1: an agent competes with structured search and learned policies to propose candidates; the compiler substrate builds them; validation gates reject failures; the target measures kernel time, application metric and search cost; accepted artifacts go to a store and a deterministic runtime. Loop 2: an agent generates compiler components that merge only after a held-out regression check. Loop 3: a fixed proposer suggests a restricted, versioned controller change, compared with a fixed controller, a memory-only variant and conventional search on a frozen evaluator, and promoted only if application results or search efficiency improve. No loop may relax the validation contract.">
<rect class="bg" x="0" y="0" width="1200" height="918"/>
<style>
.bg{fill:#FFFFFF}
.panel{fill:#FFFFFF;stroke:#C6CCD6;stroke-width:1.2}
.panel3{fill:#FFFFFF;stroke:#C6CCD6;stroke-width:1.2;stroke-dasharray:8 4}
.sub{fill:#EEF0F4;stroke:#C6CCD6;stroke-width:1}
.agent{fill:#DDF1EC;stroke:#0B7A69;stroke-width:1.6}
.contract{fill:#E7EAF1;stroke:#C6CCD6;stroke-width:1.2}
.frozen{fill:#EEF0F4;stroke:#B8322A;stroke-width:1.4;stroke-dasharray:4 3}
.pill{fill:#FFFFFF;stroke:#C6CCD6}
.warnpill{fill:none;stroke:#B8322A}
.rung{fill:#FFFFFF;stroke:#0B7A69;stroke-width:.8;stroke-opacity:.5}
.rungStart{fill:#FFFFFF;stroke:#0B7A69;stroke-width:2}
.rungLate{fill:none;stroke:#0B7A69;stroke-width:.8;stroke-dasharray:3 3}
.lock rect{fill:#B8322A} .lock path{stroke:#B8322A;stroke-width:1.6}
text{fill:#18202C;font-family:"IBM Plex Sans","Helvetica Neue",Arial,"Liberation Sans",sans-serif}
.t{font-size:13px}
.s{font-size:12px;fill:#586173}
.h,.hA{font-family:"IBM Plex Sans Condensed","Arial Narrow","Liberation Sans Narrow",Arial,sans-serif;font-weight:600;font-size:14.5px}
.hA{fill:#0B7A69}
.eyebrow,.note,.lbl,.lblA,.lblF,.pillT,.warnT,.tagA{font-family:"IBM Plex Mono",Menlo,Consolas,"Liberation Mono",monospace}
.eyebrow{font-size:11px;letter-spacing:.08em;fill:#586173}
.note,.warnT,.tagA{font-size:10.5px}
.note{fill:#586173}
.lbl,.lblA,.lblF,.pillT{font-size:11px}
.lbl{fill:#586173} .lblA,.tagA{fill:#0B7A69} .lblF,.warnT{fill:#B8322A}
.flow{stroke:#18202C;stroke-width:1.4}
.flowA{stroke:#0B7A69;stroke-width:1.8}
.fb{stroke:#586173;stroke-width:1.4;stroke-dasharray:5 4;fill:none}
.forbid{stroke:#B8322A;stroke-width:1.4;stroke-dasharray:4 4}
.xmark line{stroke:#B8322A;stroke-width:2.2}
.mk{fill:#18202C} .mkA{fill:#0B7A69} .mkF{fill:#B8322A}
</style>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkF"/></marker>
    </defs>
<rect x="30" y="20" width="1140" height="64" rx="6" class="contract"/>
<text x="46" y="44" class="eyebrow" text-anchor="start">FIXED BY HUMANS</text>
<text x="46" y="68" class="t" text-anchor="start">Workload · objective (e.g. throughput under a latency limit) · validation contract: semantics, numerical or statistical tolerance, supported inputs</text>
<rect x="30" y="130" width="120" height="230" rx="6" class="panel"/>
<text x="90" y="154" class="h" text-anchor="middle">Baseline &amp;</text>
<text x="90" y="172" class="h" text-anchor="middle">profile</text>
<text x="90" y="210" class="s" text-anchor="middle">strong compiled</text>
<text x="90" y="226" class="s" text-anchor="middle">or library baseline</text>
<text x="90" y="258" class="s" text-anchor="middle">whole-app profile</text>
<text x="90" y="274" class="s" text-anchor="middle">finds the</text>
<text x="90" y="290" class="s" text-anchor="middle">addressable time</text>
<rect x="200" y="130" width="240" height="230" rx="6" class="panel"/>
<text x="214" y="152" class="h" text-anchor="start">Optimizer control plane</text>
<rect x="212" y="164" width="216" height="96" rx="4" class="agent"/>
