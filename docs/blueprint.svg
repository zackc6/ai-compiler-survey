<text x="224" y="204" class="s" text-anchor="start">proposes configs and scope</text>
<text x="224" y="221" class="s" text-anchor="start">synthesizes kernels, rewrites</text>
<text x="224" y="238" class="s" text-anchor="start">diagnoses failed candidates</text>
<text x="224" y="255" class="s" text-anchor="start">reuses prior experiments</text>
<rect x="212" y="268" width="216" height="32" rx="4" class="sub"/>
<text x="320.0" y="288.5" class="t" text-anchor="middle">Learned policy</text>
<rect x="212" y="308" width="216" height="32" rx="4" class="sub"/>
<text x="320.0" y="328.5" class="t" text-anchor="middle">Structured search / tuner</text>
<text x="320.0" y="354" class="note" text-anchor="middle">same feedback · same budget</text>
<rect x="490" y="130" width="190" height="230" rx="6" class="panel"/>
<text x="504" y="152" class="h" text-anchor="start">Compiler substrate</text>
<rect x="502" y="166" width="166" height="34" rx="4" class="sub"/>
