<text x="705.0" y="237" class="lbl" text-anchor="middle">build</text>
<line x1="900" y1="245" x2="948" y2="245" class="flow" marker-end="url(#arr)"/>
<text x="925.0" y="237" class="lbl" text-anchor="middle">passes</text>
<polyline points="1010,360 1010,400 325,400 325,362" class="fb" fill="none" marker-end="url(#arr)"/>
<line x1="825" y1="360" x2="825" y2="400" class="fb"/>
