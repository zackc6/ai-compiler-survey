<text x="831" y="108" class="lbl" text-anchor="start">acceptance</text>
<line x1="1075" y1="84" x2="1075" y2="128" class="flow" marker-end="url(#arr)"/>
<text x="1081" y="108" class="lbl" text-anchor="start">objective</text>
<line x1="390" y1="164" x2="390" y2="86" class="forbid" marker-end="url(#arrF)"/>
