<text x="585.0" y="313.5" class="t" text-anchor="middle">Code generation</text>
<text x="585.0" y="354" class="note" text-anchor="middle">keep · generate · replace</text>
<rect x="730" y="130" width="170" height="230" rx="6" class="panel"/>
<text x="744" y="152" class="h" text-anchor="start">Validation gates</text>
<rect x="742" y="166" width="146" height="34" rx="4" class="sub"/>
<text x="815.0" y="187.5" class="t" text-anchor="middle">Static checks</text>
