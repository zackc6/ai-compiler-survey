<text x="1016" y="382" class="lbl" text-anchor="start">profiles, cost</text>
<rect x="330" y="389" width="200" height="22" rx="11" class="pill"/>
<text x="430" y="404" class="pillT" text-anchor="middle">Loop 1 · per workload</text>
<rect x="950" y="450" width="220" height="120" rx="6" class="panel"/>
<text x="964" y="472" class="h" text-anchor="start">Artifact &amp; experiment store</text>
<text x="964" y="498" class="s" text-anchor="start">kernels, configs, heuristics</text>
<text x="964" y="518" class="s" text-anchor="start">failed and slow candidates too</text>
<text x="964" y="538" class="s" text-anchor="start">controller, memory: own versions</text>
<line x1="1140" y1="360" x2="1140" y2="448" class="flow" marker-end="url(#arr)"/>
<text x="1146" y="434" class="lbl" text-anchor="start">accept</text>
<line x1="980" y1="450" x2="980" y2="402" class="fb" marker-end="url(#arr)"/>
<text x="986" y="434" class="lbl" text-anchor="start">history</text>
<rect x="640" y="450" width="260" height="120" rx="6" class="panel"/>
<text x="654" y="472" class="h" text-anchor="start">Deployed runtime</text>
<text x="654" y="498" class="s" text-anchor="start">runs accepted artifacts</text>
<text x="654" y="518" class="s" text-anchor="start">keeps a working fallback</text>
<text x="654" y="538" class="s" text-anchor="start">no model in the execution path</text>
<line x1="950" y1="510" x2="902" y2="510" class="flow" marker-end="url(#arr)"/>
<text x="925.0" y="502" class="lbl" text-anchor="middle">ship</text>
<polyline points="670,450 670,424 90,424 90,362" class="fb" fill="none" marker-end="url(#arr)"/>
<text x="110" y="440" class="lbl" text-anchor="start">production profiles, drift</text>
<rect x="200" y="450" width="400" height="150" rx="6" class="panel"/>
<text x="214" y="472" class="h" text-anchor="start">Loop 2 · compiler improvement, offline</text>
<rect x="212" y="486" width="176" height="96" rx="4" class="agent"/>
<text x="224" y="506" class="hA" text-anchor="start">Agent</text>
<text x="224" y="526" class="s" text-anchor="start">generates a heuristic,</text>
<text x="224" y="543" class="s" text-anchor="start">transformation, or</text>
<text x="224" y="560" class="s" text-anchor="start">backend piece</text>
<rect x="412" y="486" width="176" height="96" rx="4" class="sub"/>
<text x="500" y="514" class="t" text-anchor="middle">Held-out corpus</text>
<text x="500" y="532" class="t" text-anchor="middle">regression check</text>
<text x="500" y="554" class="s" text-anchor="middle">separate from</text>
<text x="500" y="570" class="s" text-anchor="middle">search workloads</text>
<line x1="388" y1="534" x2="410" y2="534" class="flow" marker-end="url(#arr)"/>
<line x1="560" y1="486" x2="560" y2="362" class="flowA" marker-end="url(#arrA)"/>
<text x="566" y="378" class="lblA" text-anchor="start">merge into</text>
<text x="566" y="392" class="lblA" text-anchor="start">default path</text>
<text x="200" y="620" class="lbl" text-anchor="start">Loops 2 and 3: measure each change alone, then combined</text>
<rect x="200" y="630" width="970" height="210" rx="6" class="panel3"/>
<text x="214" y="652" class="h" text-anchor="start">Loop 3 · controller improvement, offline</text>
<rect x="610" y="639" width="118" height="18" rx="9" class="warnpill"/>
<text x="669" y="652" class="warnT" text-anchor="middle">narrow evidence</text>
<rect x="212" y="666" width="330" height="160" rx="4" class="agent"/>
<text x="224" y="686" class="hA" text-anchor="start">Fixed proposer</text>
<rect x="224" y="696" width="306" height="20" rx="3" class="rungLate"/>
<text x="232" y="710" class="s" text-anchor="start">improvement procedure (recursive)</text>
<text x="522" y="710" class="note" text-anchor="end">later</text>
<rect x="224" y="720" width="306" height="20" rx="3" class="rung"/>
<text x="232" y="734" class="s" text-anchor="start">controller code</text>
<rect x="224" y="744" width="306" height="20" rx="3" class="rung"/>
<text x="232" y="758" class="s" text-anchor="start">workflow, budget split, topology</text>
<rect x="224" y="768" width="306" height="20" rx="3" class="rungStart"/>
<text x="232" y="782" class="s" text-anchor="start">instructions, retrieval policy</text>
<text x="522" y="782" class="tagA" text-anchor="end">start here</text>
<rect x="224" y="792" width="306" height="20" rx="3" class="rung"/>
<text x="232" y="806" class="s" text-anchor="start">memory snapshot only</text>
<text x="522" y="806" class="note" text-anchor="end">baseline arm</text>
<line x1="542" y1="746" x2="570" y2="746" class="flow" marker-end="url(#arr)"/>
<rect x="572" y="666" width="340" height="160" rx="4" class="frozen"/>
<text x="586" y="686" class="h" text-anchor="start">Four arms on a frozen evaluator</text>
<text x="586" y="708" class="s" text-anchor="start">fixed controller · fixed + memory only</text>
<text x="586" y="726" class="s" text-anchor="start">evolved version · conventional search</text>
<text x="586" y="744" class="s" text-anchor="start">same compiler tools, model, hardware,</text>
<text x="586" y="762" class="s" text-anchor="start">per-job budget; held-out workload</text>
<text x="586" y="780" class="s" text-anchor="start">families; repeated runs</text>
<text x="586" y="798" class="lblF" text-anchor="start">gates, measurement, held-out set: read-only</text>
<g class="lock"><rect x="884" y="676" width="16" height="12" rx="2"/><path d="M887,676 v-4 a5,5 0 0 1 10,0 v4" fill="none"/></g>
<line x1="912" y1="746" x2="928" y2="746" class="flow" marker-end="url(#arr)"/>
