<text x="944" y="708" class="s" text-anchor="start">application result and search</text>
<text x="944" y="726" class="s" text-anchor="start">cost, reported separately</text>
<text x="944" y="744" class="s" text-anchor="start">development cost disclosed</text>
<text x="944" y="762" class="s" text-anchor="start">version N kept for rollback</text>
<text x="944" y="780" class="s" text-anchor="start">fresh searches only use</text>
