<text x="1060.0" y="316" class="s" text-anchor="middle">tokens · device-hours · time</text>
<text x="1060.0" y="354" class="note" text-anchor="middle">gain must beat measurement noise</text>
<line x1="260" y1="84" x2="260" y2="128" class="flow" marker-end="url(#arr)"/>
<text x="266" y="108" class="lbl" text-anchor="start">actions, budget</text>
