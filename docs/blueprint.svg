<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">Three improvement targets in an AI compiler</title><desc id="desc">One possible starting design. Application search uses agents, conventional search, or learned policies. Compiler tools build candidates; validation and measurement return feedback. Accepted artifacts run without optimizer-model calls during normal execution. Controller and compiler development receive development traces, propose changes, and iterate using development results. Selected versions pass separate final evaluation before promotion. Final evaluation is withheld from development. The three targets do not require three agents.</desc>
<style>
text{font-family:"IBM Plex Sans",Arial,"Liberation Sans",sans-serif;fill:#182838}
.title{font-size:25px;font-weight:700}
.heading{font-size:18px;font-weight:700}
.smallhead{font-size:16px;font-weight:700}
.body{font-size:16px}
.note{font-size:14.5px;fill:#42576a}
.label{font-size:14.5px;fill:#42576a}
.green{fill:#096d61}.red{fill:#9c4337}
.panel{fill:#f7f9fc;stroke:#bcc9d6;stroke-width:1.3}
.card{fill:white;stroke:#b4c2cf;stroke-width:1.3}
.agent{fill:#e2f3ee;stroke:#087f70;stroke-width:1.8}
.final{fill:#fff5ee;stroke:#b36b43;stroke-width:1.6}
.contract{fill:#eaf0f7;stroke:#aebfd0;stroke-width:1.3}
.flow,.feedback,.promote{fill:none;stroke:#33495d;stroke-width:1.8;stroke-linejoin:round}
.feedback{stroke:#65798c;stroke-dasharray:6 4}
.promote{stroke:#087f70;stroke-width:2.2}
.halo{fill:none;stroke:white;stroke-width:6;stroke-linejoin:round}
</style>
