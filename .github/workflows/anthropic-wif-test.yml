name: anthropic-wif-test
on: push
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01DKHqwLcAaLqSg3d3HXNrFm",
            "organization_id": "c7c14a13-8313-432e-930e-a4da174f4c20",
            "service_account_id": "svac_01TiJjuCLRkekDY7ULbZQXPJ",
            "workspace_id": "wrkspc_01BkqD2efdXZes9mPFndddKQ"
          }
          JSON

  minimal-claude-run:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Smallest possible Claude Code run via WIF
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01DKHqwLcAaLqSg3d3HXNrFm
          anthropic_organization_id: c7c14a13-8313-432e-930e-a4da174f4c20
          anthropic_service_account_id: svac_01TiJjuCLRkekDY7ULbZQXPJ
          anthropic_workspace_id: wrkspc_01BkqD2efdXZes9mPFndddKQ
          prompt: "Reply with the single word OK and stop."
          claude_args: "--max-turns 1"
      - name: Show the API error in the job summary
        if: always()
        run: |
          f="${{ steps.claude.outputs.execution_file }}"
          echo "conclusion=${{ steps.claude.outputs.conclusion }}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$f" ] && [ -f "$f" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 4000 "$f" | sed -E 's/(sk-ant-[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+)/<redacted>/g' | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no execution file" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
