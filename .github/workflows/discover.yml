name: Mechanical source discovery

# Enumerates candidate sources from arXiv listings, venue tables of contents (DBLP),
# OpenAlex cited-by of Tier A digests, GitHub orgs already referenced, and PyPI
# releases, then writes reference/discovery/<date>.md on a branch for the agents to
# triage. This replaces reliance on web-search ranking, which missed TileLoom,
# TASO/Tensat, PeepholeBench, LLVM-Bench, CIRBench and TileFoundry.

on:
  schedule:
    - cron: "17 22 * * 6"   # Saturday 22:17 UTC = Sunday 06:17 HKT, before the Monday sweep
  workflow_dispatch:
    inputs:
      since:
        description: "Start date YYYY-MM-DD (default: 21 days ago)"
        required: false
  push:
    paths:
      - scripts/discover.py
      - .github/workflows/discover.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SINCE="${{ github.event.inputs.since }}"
          if [ -n "$SINCE" ]; then python3 scripts/discover.py --since "$SINCE"; else python3 scripts/discover.py; fi
      - name: Publish ledger on a branch and announce in the Review thread
        run: |
          set -e
          f=$(ls reference/discovery/*.md | tail -1)
          n=$(grep -oE '\*\*[0-9]+ new source leads\*\*' "$f" | grep -oE '[0-9]+' | head -1)
          events=$(grep -oE '\*\*[0-9]+ indexed-repo events\*\*' "$f" | grep -oE '[0-9]+' | head -1)
          d=$(date -u +%Y-%m-%d)
          echo "ledger=$f new_source_leads=$n indexed_repo_events=$events"
          { echo "## Discovery $d"; echo; head -c 6000 "$f"; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "Claude (discovery)"
          git config user.email "claude-action@users.noreply.github.com"
          br="claude/discovery-$d"
          # Never rewrite a discovery branch being reviewed or triaged.
          if git ls-remote --exit-code --heads origin "$br" >/dev/null; then
            echo "Existing discovery branch $br preserved; skip duplicate publication"
            exit 0
          fi
          git checkout -b "$br"
          git add reference/discovery
          git commit -m "discovery: mechanical ledger $d ($n new source leads, $events repo events)"
          git push origin "$br"
          for i in 1 2 3 4; do
            git fetch origin main
            git checkout -B main origin/main
            python3 scripts/announce_discovery.py "$f" "$n" "$events" "$br" "$d"
            git add STATUS.md
            git commit -m "status: discovery ledger $d announced ($n new candidates)"
            if git push origin HEAD:main; then break; fi
            echo "push raced, retry $i"; sleep 15
          done
